<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SI_Animation_Task</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/jpeg" href="images/favicon.jpg">  
</head>
<body>
  <canvas id="fullScreen"></canvas>

  <div class="controls">
    <button class="Button" id="playButton" >
      <svg id="pause" width="16" height="16" viewBox="0 0 24 24" fill="black">
        <rect x="5" y="3" width="4" height="18"/>
        <rect x="15" y="3" width="4" height="18"/>
      </svg>
      <svg id="play" width="16" height="16" viewBox="0 0 24 24" fill="black" style="display:none">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <div class="rangebar">
      <div class="rangetext">
      <span>Speed </span><span id="speedTxt">1.0x</span>
      </div>
      <input type="range" id="slide" min="0" max="3" step="0.1" value="1">
    </div>
  
  </div>
  <script src="script.js"></script>
</body>
</html>
